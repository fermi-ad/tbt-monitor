[package]
name = "tbt-monitor-tui"
version = "0.1.0"
edition = "2024"
description = "Monitor, capture, and analyze turn-by-turn beam-position data for the Fermilab Mu2e Delivery Ring"
license = "BSD-3-Clause"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.28"
redis = "0.27"
roxmltree = "0.20"
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
