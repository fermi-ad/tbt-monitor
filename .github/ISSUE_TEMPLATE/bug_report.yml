name: Bug Report
description: Report a defect or regression
title: "[Bug] "
labels:
  - type:bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction Steps
      description: Exact commands/config/inputs used
      placeholder: |
        1. Run: ...
        2. Config: ...
        3. Observe: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: artifacts
    attributes:
      label: Logs / Artifacts
      description: Attach or reference summary txt/csv/png paths
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Commit / Image Tag
      placeholder: git SHA or docker tag
    validations:
      required: false
